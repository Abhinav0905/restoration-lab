<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
    body{position:relative;background:#071a33 url("restoration-lab-cover-background-v2.png") center/cover no-repeat;color:white;font-family:Arial,sans-serif}
    .top{position:absolute;inset:0 0 auto 0;height:280px;padding:52px 62px;background:linear-gradient(180deg,rgba(7,26,51,.98),rgba(7,26,51,.91) 75%,rgba(7,26,51,0));}
    .mark{display:flex;align-items:center;gap:13px;color:#ffbd52;font-size:17px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .mark i{display:block;width:34px;height:5px;background:#ffbd52;box-shadow:16px 10px 0 #7ce3c0;font-style:normal}
    h1{margin:27px 0 0;font-size:74px;line-height:.95;letter-spacing:-.045em}
    .tag{position:absolute;top:192px;left:64px;font-size:27px;font-weight:600;color:#d8e6f2}
    .badge{position:absolute;right:48px;bottom:42px;padding:12px 18px;border:1px solid rgba(124,227,192,.55);border-radius:999px;background:rgba(7,26,51,.86);color:#bdf7e3;font-size:17px;font-weight:800;box-shadow:0 8px 22px rgba(0,0,0,.28)}
  </style>
</head>
<body>
  <div class="top">
    <div class="mark"><i></i> distribution safety training</div>
    <h1>Restoration Lab</h1>
    <div class="tag">Safe switching starts before the field.</div>
  </div>
  <div class="badge">TRAIN • CHECK • RESTORE</div>
</body>
</html>
